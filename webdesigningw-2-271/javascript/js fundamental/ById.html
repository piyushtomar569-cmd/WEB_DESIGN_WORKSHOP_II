<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Welcome</h1>
    <button onclick="changeText()" id="hello">Click Me</button>
    <script>
        function changeText(){
            title.innerText ="hello";
            title.style.color = "red";
        }
    </script>
</body>
</html>
