<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
           width: 100%;
            height: 100vh; 
        }
        #main {
            padding: 50px;
                 height: 100%;
           width: 100%;
            background-color: rgb(124, 121, 121);
        }
        input {
            display: block;
        }
        .card {
            max-width: 300px;
           padding: 20px;
              margin-top: 40px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #e3e3e3;
            color: white;
        }
        .profile{
         width: 50px;
         height: 50px;
         background-color: red;
         border-radius: 50%;
         margin-bottom: 7px;
         overflow: hidden;
        }
         .profile img{
         width: 100%;
         height: 100%;
        object-fit: cover;
        }
        .card p{
            font-size: 12px;
            margin-top: 10px;
        }
        .card h5{
            margin-top: 3px;
        }
        .card h3{
            font-weight: bold;
            font-style: italic;
            color: rgb(241, 9, 48);
        }
    </style>
</head>
<body>
    <div id="main">
    <form action=""> 
        <input type="text" placeholder="image url">
        <input type="text" placeholder="age">
        <input type="text" placeholder="email">
        <input type="text" placeholder="enter your details here">
        <input type="submit">
    </form>
  
    </div>
    <script src="form.js"></script>
</body>
</html>
