<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
           width: 100%;
            height: 100vh; 
            overflow: hidden;
            position: relative;
        }
        #example {
            position: absolute;
            width: 400px;
            height: 400px;
            background-color: red;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 1s;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="example"></div>
    <script src="mouse.js"></script>
</body>
</html>
