<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Simulation</title>

<style>
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #121212;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    text-align: center;
    width: 300px;
}

.progress-box {
    width: 100%;
    height: 25px;
    background: #333;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ffcc, #0099ff);
    border-radius: 20px;
    /* animation: download 5s linear forwards; */
}
/*
@keyframes download {
    from { width: 0%; }
    to { width: 100%; }
}
*/
.text {
    margin-top: 10px;
    animation: textChange 5s linear forwards;
}


</style>
</head>

<body>

<div class="container">
    <h2>Downloading File...</h2>
    <div class="progress-box">
        <div class="progress-bar"></div>
    </div>
    <p class="text">Please wait...</p>
</div>
<script src="download.js"></script>
</body>
</html>
